<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8aa3e8"/>
      <stop offset="100%" stop-color="#5a72c0"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile for browser tabs, which prefer this SVG. favicon.ico / apple-icon.png stay full-bleed
       squares for Google's circle crop, where transparent corners showed as a white ring.
       The O is a drawn ring, not <text>: favicons can't load the Outfit font. -->
  <rect width="32" height="32" rx="7" fill="#07070f"/>
  <circle cx="16" cy="16" r="7.9" fill="none" stroke="url(#g)" stroke-width="4.6"/>
</svg>
